<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200">
  <defs>
    <style>
      .title{font:700 40px 'Segoe UI',Arial,sans-serif;fill:#17324d}.subtitle{font:400 19px 'Segoe UI',Arial,sans-serif;fill:#526779}
      .h1{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#17324d}.h2{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#17324d}
      .txt{font:500 18px 'Segoe UI',Arial,sans-serif;fill:#17324d}.small{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#314b60}
      .tiny{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#526779}.white{fill:#fff}.bold{font-weight:700}
      .box{stroke:#526779;stroke-width:2.2;rx:14}.group{fill:#f7fafc;stroke:#c9d7e2;stroke-width:2;rx:18}
      .arrow{fill:none;stroke:#526779;stroke-width:3;marker-end:url(#arrow)}.arrowRed{fill:none;stroke:#d64545;stroke-width:3;marker-end:url(#arrowRed)}
      .dash{fill:none;stroke:#7b8b99;stroke-width:2;stroke-dasharray:8 7}.label{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#526779}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#526779"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#d64545"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="2200" fill="#eef3f7"/>
  <rect x="45" y="40" width="1510" height="2120" rx="24" fill="#fff" stroke="#d5e0e8" stroke-width="2"/>

  <text x="90" y="105" class="title">Dependencias y avance de operaciones del proyecto</text>
  <text x="90" y="142" class="subtitle">Flujo funcional · programación, precedencias, ejecución y progreso (sin materiales, stock ni costos)</text>

  <!-- Hierarchy -->
  <rect x="90" y="185" width="1420" height="245" class="group"/>
  <text x="120" y="225" class="h1">1 · Contexto jerárquico del plan activo</text>
  <rect x="120" y="255" width="250" height="74" class="box" fill="#173f64" filter="url(#shadow)"/>
  <text x="245" y="286" class="txt white bold" text-anchor="middle">PROYECTO</text><text x="245" y="311" class="small white" text-anchor="middle">Proyecto seleccionado</text>
  <path d="M370 292 H430" class="arrow"/>
  <rect x="430" y="255" width="285" height="74" class="box" fill="#28658f" filter="url(#shadow)"/>
  <text x="572" y="286" class="txt white bold" text-anchor="middle">VERSIÓN ACTIVA</text><text x="572" y="311" class="small white" text-anchor="middle">Única planificación vigente</text>
  <path d="M715 292 H775" class="arrow"/>
  <rect x="775" y="255" width="245" height="74" class="box" fill="#dcebf5"/>
  <text x="897" y="286" class="txt bold" text-anchor="middle">ETAPAS</text><text x="897" y="311" class="small" text-anchor="middle">Orden por secuencia</text>
  <path d="M1020 292 H1080" class="arrow"/>
  <rect x="1080" y="255" width="390" height="74" class="box" fill="#eaf2f7"/>
  <text x="1275" y="286" class="txt bold" text-anchor="middle">OPERACIONES ACTIVAS</text><text x="1275" y="311" class="small" text-anchor="middle">Orden + predecesoras + sucesoras</text>
  <path d="M1275 329 V366 H850" class="dash"/>
  <rect x="510" y="351" width="680" height="54" rx="12" fill="#fff4db" stroke="#e19a25" stroke-width="2"/>
  <text x="850" y="384" class="small" text-anchor="middle"><tspan class="bold">Filtro activo:</tspan> las operaciones archivadas no participan del flujo ni de sus validaciones.</text>

  <!-- Main flow -->
  <rect x="90" y="465" width="1420" height="915" class="group"/>
  <text x="120" y="508" class="h1">2 · Ciclo funcional de cada operación</text>

  <rect x="145" y="545" width="310" height="68" class="box" fill="#dcebf5"/>
  <text x="300" y="573" class="txt bold" text-anchor="middle">Tomar siguiente operación</text><text x="300" y="597" class="small" text-anchor="middle">según etapa y secuencia</text>
  <path d="M455 579 H535" class="arrow"/>
  <polygon points="650,520 765,579 650,638 535,579" fill="#fff4db" stroke="#526779" stroke-width="2.2"/>
  <text x="650" y="571" class="small bold" text-anchor="middle">¿Dependencia válida?</text><text x="650" y="592" class="tiny" text-anchor="middle">No propia · sin ciclos</text>
  <path d="M650 638 V690" class="arrowRed"/><text x="666" y="670" class="label" fill="#d64545">NO</text>
  <rect x="505" y="690" width="290" height="72" class="box" fill="#f8d7da" stroke="#d64545"/>
  <text x="650" y="719" class="txt bold" text-anchor="middle" fill="#a72828">ERROR DE DEPENDENCIA</text><text x="650" y="744" class="small" text-anchor="middle" fill="#a72828">Corregir antes de planificar</text>
  <path d="M765 579 H835" class="arrow"/><text x="791" y="561" class="label">SÍ</text>
  <polygon points="965,520 1095,579 965,638 835,579" fill="#fff" stroke="#526779" stroke-width="2.2"/>
  <text x="965" y="571" class="small bold" text-anchor="middle">¿Tiene predecesoras?</text>
  <path d="M965 638 V708" class="arrow"/><text x="981" y="670" class="label">NO</text>
  <polygon points="965,708 1095,767 965,826 835,767" fill="#fff" stroke="#526779" stroke-width="2.2"/>
  <text x="965" y="758" class="small bold" text-anchor="middle">¿Llegó su fecha</text><text x="965" y="779" class="small bold" text-anchor="middle">habilitada?</text>
  <path d="M1095 579 H1230 V708" class="arrow"/><text x="1110" y="561" class="label">SÍ</text>
  <polygon points="1230,708 1380,767 1230,826 1080,767" fill="#fff" stroke="#526779" stroke-width="2.2"/>
  <text x="1230" y="749" class="small bold" text-anchor="middle">¿Todas las predecesoras</text><text x="1230" y="771" class="small bold" text-anchor="middle">están completas?</text><text x="1230" y="794" class="tiny" text-anchor="middle">Convergencia obligatoria</text>
  <path d="M1230 826 V875 H1125" class="arrow"/><text x="1246" y="855" class="label">NO</text>
  <rect x="950" y="875" width="350" height="72" class="box" fill="#ffe0b2" stroke="#dc8522"/>
  <text x="1125" y="904" class="txt bold" text-anchor="middle">BLOQUEADA</text><text x="1125" y="929" class="small" text-anchor="middle">Esperar y reevaluar al completar una</text>
  <path d="M835 767 H750 V875" class="arrow"/><text x="793" y="749" class="label">SÍ</text>
  <path d="M1080 767 H750" class="arrow"/><text x="1042" y="749" class="label">SÍ</text>
  <rect x="575" y="875" width="350" height="72" class="box" fill="#cfe8ff" stroke="#2f78b7"/>
  <text x="750" y="904" class="txt bold" text-anchor="middle">HABILITADA PARA INICIAR</text><text x="750" y="929" class="small" text-anchor="middle">Respetar fecha y fin real de predecesoras</text>
  <path d="M835 767 H465 V875" class="arrow"/><text x="800" y="791" class="label">NO</text>
  <rect x="215" y="875" width="300" height="72" class="box" fill="#e5e7eb"/>
  <text x="365" y="904" class="txt bold" text-anchor="middle">PENDIENTE</text><text x="365" y="929" class="small" text-anchor="middle">Esperar fecha habilitada</text>

  <path d="M750 947 V1005" class="arrow"/>
  <rect x="570" y="1005" width="360" height="75" class="box" fill="#cdeefe" stroke="#3296c8"/>
  <text x="750" y="1035" class="txt bold" text-anchor="middle">INICIAR → EN CURSO</text><text x="750" y="1061" class="small" text-anchor="middle">Inicio real ≥ fin real de cada predecesora</text>
  <path d="M750 1080 V1130" class="arrow"/>
  <rect x="530" y="1130" width="440" height="80" class="box" fill="#cdeefe" stroke="#3296c8"/>
  <text x="750" y="1160" class="txt bold" text-anchor="middle">REGISTRAR AVANCE</text><text x="750" y="1186" class="small" text-anchor="middle">Porcentaje nuevo ≥ actual y ≤ 100%</text>
  <path d="M970 1170 H1080" class="arrow"/>
  <polygon points="1210,1111 1340,1170 1210,1229 1080,1170" fill="#fff" stroke="#526779" stroke-width="2.2"/>
  <text x="1210" y="1162" class="small bold" text-anchor="middle">¿Finalizó?</text><text x="1210" y="1184" class="tiny" text-anchor="middle">Avance = 100%</text>
  <path d="M1210 1229 V1278" class="arrow"/><text x="1226" y="1257" class="label">SÍ</text>
  <rect x="1035" y="1278" width="350" height="75" class="box" fill="#cfead6" stroke="#3b9b58"/>
  <text x="1210" y="1308" class="txt bold" text-anchor="middle">COMPLETA</text><text x="1210" y="1334" class="small" text-anchor="middle">100% + fecha real de finalización</text>
  <path d="M1080 1170 H1015 V1095 H750 V1130" class="arrow"/><text x="1027" y="1150" class="label">NO</text>
  <path d="M1035 1315 H900 V1345 H470 V1260" class="arrow"/>
  <rect x="180" y="1230" width="290" height="82" class="box" fill="#dcebf5"/>
  <text x="325" y="1260" class="txt bold" text-anchor="middle">REEVALUAR SUCESORAS</text><text x="325" y="1286" class="small" text-anchor="middle">Todas sus ramas dependientes</text>
  <path d="M180 1270 H125 V579 H145" class="arrow"/>

  <!-- Example -->
  <rect x="90" y="1415" width="1420" height="475" class="group"/>
  <text x="120" y="1458" class="h1">3 · Ejemplo práctico: paralelismo y convergencia</text>
  <text x="120" y="1490" class="small">Las flechas siempre apuntan desde la predecesora hacia la sucesora.</text>
  <rect x="120" y="1530" width="315" height="90" class="box" fill="#cfead6" stroke="#3b9b58" filter="url(#shadow)"/>
  <text x="277" y="1562" class="txt bold" text-anchor="middle">OP. 10 · COMPLETA</text><text x="277" y="1588" class="small" text-anchor="middle">Preparación del terreno · 100%</text>
  <path d="M435 1575 H510 V1518 H585" class="arrow"/><path d="M510 1575 V1678 H585" class="arrow"/>
  <text x="500" y="1555" class="tiny" text-anchor="end">ramas paralelas</text>
  <rect x="585" y="1475" width="350" height="86" class="box" fill="#cdeefe" stroke="#3296c8" filter="url(#shadow)"/>
  <text x="760" y="1507" class="txt bold" text-anchor="middle">OP. 20 · EN CURSO</text><text x="760" y="1533" class="small" text-anchor="middle">Instalación eléctrica · 60%</text>
  <rect x="585" y="1635" width="350" height="86" class="box" fill="#cfead6" stroke="#3b9b58" filter="url(#shadow)"/>
  <text x="760" y="1667" class="txt bold" text-anchor="middle">OP. 30 · COMPLETA</text><text x="760" y="1693" class="small" text-anchor="middle">Instalación sanitaria · 100%</text>
  <path d="M935 1518 H1035 V1575" class="arrow"/><path d="M935 1678 H1035 V1575" class="arrow"/>
  <polygon points="1160,1510 1285,1575 1160,1640 1035,1575" fill="#fff4db" stroke="#526779" stroke-width="2.2"/>
  <text x="1160" y="1558" class="small bold" text-anchor="middle">¿20 y 30 están</text><text x="1160" y="1580" class="small bold" text-anchor="middle">COMPLETAS?</text><text x="1160" y="1604" class="tiny" text-anchor="middle">Validación conjunta</text>
  <path d="M1160 1640 V1715" class="arrow"/><text x="1176" y="1680" class="label">NO</text>
  <rect x="1000" y="1715" width="320" height="82" class="box" fill="#ffe0b2" stroke="#dc8522"/>
  <text x="1160" y="1747" class="txt bold" text-anchor="middle">OP. 40 · BLOQUEADA</text><text x="1160" y="1773" class="small" text-anchor="middle">Cierre de paredes · espera a Op. 20</text>
  <path d="M1285 1575 H1390 V1715" class="dash"/><text x="1325" y="1556" class="label">SÍ → habilitar</text>
  <rect x="120" y="1760" width="760" height="88" rx="14" fill="#fff" stroke="#b8c8d5" stroke-width="2"/>
  <text x="145" y="1791" class="small bold">Lectura del ejemplo:</text><text x="145" y="1818" class="small">10 libera dos ramas; 20 y 30 avanzan en paralelo; ambas convergen antes de 40.</text>

  <!-- legend -->
  <rect x="90" y="1925" width="1420" height="190" class="group"/>
  <text x="120" y="1968" class="h1">Leyenda de estados y símbolos</text>
  <rect x="120" y="1995" width="28" height="28" rx="6" fill="#e5e7eb" stroke="#526779"/><text x="160" y="2016" class="small">Pendiente</text>
  <rect x="285" y="1995" width="28" height="28" rx="6" fill="#ffe0b2" stroke="#dc8522"/><text x="325" y="2016" class="small">Bloqueada / atrasada</text>
  <rect x="535" y="1995" width="28" height="28" rx="6" fill="#cfe8ff" stroke="#2f78b7"/><text x="575" y="2016" class="small">Habilitada</text>
  <rect x="735" y="1995" width="28" height="28" rx="6" fill="#cdeefe" stroke="#3296c8"/><text x="775" y="2016" class="small">En curso</text>
  <rect x="930" y="1995" width="28" height="28" rx="6" fill="#cfead6" stroke="#3b9b58"/><text x="970" y="2016" class="small">Completa</text>
  <rect x="1110" y="1995" width="28" height="28" rx="6" fill="#f8d7da" stroke="#d64545"/><text x="1150" y="2016" class="small">Error / ciclo</text>
  <polygon points="145,2050 175,2070 145,2090 115,2070" fill="#fff" stroke="#526779" stroke-width="2"/><text x="190" y="2076" class="small">Decisión / validación</text>
  <path d="M430 2070 H510" class="arrow"/><text x="525" y="2076" class="small">Dependencia (predecesora → sucesora)</text>
  <path d="M905 2070 H985" class="dash"/><text x="1000" y="2076" class="small">Resultado alternativo / habilitación futura</text>
  <text x="800" y="2150" class="tiny" text-anchor="middle">Reglas clave: sin auto-dependencias · sin ciclos · avance no decreciente · sucesora habilitada solo cuando todas sus predecesoras están completas</text>
</svg>
